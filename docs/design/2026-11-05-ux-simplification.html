<label>Состояние<select id="demo-state"><option value="normal">Обычное</option><option value="paused">Передача на паузе</option><option value="resuming">Продолжение передачи</option><option value="failed">Ошибка обработки</option><option value="partial">Частично готово</option><option value="done">Всё готово</option><option value="network">Нет свежего статуса</option><option value="link-loading">Ссылка: загрузка</option><option value="link-error">Ссылка: ошибка</option><option value="link-blocked">Ссылка: блокировка</option></select></label>
<label>Тема<select id="demo-theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
<label>Компоновка<select id="demo-layout"><option value="workspace">Кабинет</option><option value="studio">Монтажная</option></select></label>
</div></aside>
<div class="shell"><header id="header" class="app-header"></header><main id="main" class="content" tabindex="-1"></main></div>
<footer class="footer"><button type="button" data-action="support">Поддержка</button><button type="button" data-action="legal">Пользовательское соглашение</button><button type="button" data-action="privacy">Политика конфиденциальности</button></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const query=new URLSearchParams(location.search);
const store={role:'ordinary',screen:'workspace',state:'normal',file:false,music:false,teaser:true,compact:true,cta:'none',ctaUrl:'',selected:0,share:'',guestConsent:false,guestName:'',guestSelected:[],guestPacks:[],activeGuestId:null,nextGuestId:1,editCtaKind:'none',editCtaUrl:'',savedCtaKind:'none',savedCtaUrl:'',extraCodes:[],clipMusicDraft:{},clipMusicSaved:{},previewTrack:'',auth:'register',found:false,editing:false,reason:'',limit:'',commission:'',saved:false,targetBlogger:false,report:false,processing:false,played:false};
for(const key of ['role','screen','state']){const el=$('#demo-'+key);if([...el.options].some(o=>o.value===query.get(key))){store[key]=query.get(key);el.value=store[key];}}
for(const key of ['theme','layout']){const el=$('#demo-'+key);if([...el.options].some(o=>o.value===query.get(key)))el.value=query.get(key);document.documentElement.dataset[key]=el.value;}
const titles=['Как превратить длинный разговор в короткую историю','Одна ясная мысль сильнее десяти советов','Что меняется после первого опубликованного клипа'];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,action,kind='',extra='')=>`<button type="button" class="${kind}" data-action="${action}" ${extra}>${text}</button>`;
const limit=()=>store.role==='ordinary'?90:store.role==='blogger'?120:90;
const showToast=message=>{const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.hidden=true,5000);};
function heading(title,lead='',eyebrow=''){return `<header class="page-heading">${eyebrow?`<p class="eyebrow">${eyebrow}</p>`:''}<h1>${title}</h1>${lead?`<p>${lead}</p>`:''}</header>`;}
function header(){
 const publicMode=store.screen==='auth';
 const nav=publicMode?btn('Войти','login','text'):`<nav class="main-nav" aria-label="Кабинет">${btn('Новая запись','home','',store.screen==='workspace'?'aria-current="page"':'')}${btn('Мои записи','records','',['result','progress'].includes(store.screen)?'aria-current="page"':'')}${store.role==='owner'?btn('Блогеры','owners','',store.screen==='owners'?'aria-current="page"':''):''}</nav>${store.role==='owner'?'<span class="small muted">Без лимитов</span>':btn('<strong>120 кредитов</strong> · Пакеты','packages','balance-link')}${btn('Аккаунт','settings','account-link')}`;
 $('#header').innerHTML=`<a href="#" class="mark" data-action="${publicMode?'auth-home':'home'}">clipmkr</a>${nav}`;
}
function advanced(){return `<details id="upload-advanced"><summary>Дополнительные настройки<span class="changed" id="options-summary" hidden></span></summary><div class="fields"><label class="check"><input id="opt-music" type="checkbox" ${store.music?'checked':''}>Добавить музыку и финальный акцент</label><label class="check"><input id="opt-teaser" type="checkbox" ${store.teaser?'checked':''}>Заголовок в начале клипа</label><label class="check"><input id="opt-compact" type="checkbox" ${store.compact?'checked':''}>Убрать паузы</label><label>Призыв в конце клипа<select id="opt-cta"><option value="none">Без призыва</option><option value="full">Смотреть полный выпуск</option><option value="subscribe">Подписаться</option><option value="link">Перейти по ссылке</option></select></label><label id="cta-url-field" ${store.cta==='none'?'hidden':''}>Ссылка (https://…)<input id="opt-cta-url" type="url" value="${escape(store.ctaUrl)}" placeholder="https://example.com/episode"><small>Адрес и домен увидит зритель на странице клипа.</small></label><p class="small muted">Музыка: Komiku, HoliznaCC0 — CC0. Финальный акцент: Kenney — CC0.</p></div></details>`;}
function referral(){if(store.role!=='blogger')return '';let body=store.state==='link-loading'?'<p role="status" class="small muted">Готовим вашу ссылку…</p>':store.state==='link-error'?`<p role="alert" class="small">Не удалось получить ссылку. Загрузка клипов доступна.</p>${btn('Повторить','link-retry')}`:store.state==='link-blocked'?'<p role="alert" class="small">Ссылка заблокирована. Прежняя статистика сохранена. Обратитесь в поддержку: новая ссылка не обходит блокировку.</p>':`<span class="link">https://clipmkr.ru/r/author-demo</span><div class="row">${btn('Копировать ссылку','copy-ref')}${btn('Статистика →','stats','text')}</div><p class="small muted" style="margin-top:.7rem;margin-bottom:0">Ссылка для регистрации ваших подписчиков.</p>`;return `<aside class="referral" aria-label="Ваша ссылка"><h2>Ваша ссылка</h2>${body}</aside>`;}
function cost(){return store.role==='owner'?'<p class="cost">Доступ владельца: без списания кредитов. Ограничения файла и доступность обработки сохраняются.</p>':`<p class="cost">${store.file?'Предварительно: 24 кредита за 24 минуты.':'1 кредит = 60 секунд записи.'} Точный резерв — по файлу до обработки. При техническом отказе без готовых клипов резерв вернётся.</p>`;}
function workspace(){const paused=store.state==='paused',resume=store.state==='resuming';return `<div class="upload-grid"><section class="upload-main">${heading('Новая запись','Выберите видео или аудио. Получите вертикальные клипы с субтитрами.')}${paused?'<div class="notice" role="status"><h2>Передача приостановлена</h2><p class="small">Исходный файл и данные продолжения нужны в этой вкладке. Обработка ещё не началась.</p></div>':''}${resume?'<div class="notice" role="status"><h2>Продолжаем передачу</h2><p class="small">Подтверждено хранилищем: 62%. Это ещё не начало обработки.</p><div class="process-track"><span style="width:62%"></span></div></div>':''}<div class="file-row"><span class="file-icon" aria-hidden="true">${store.file||paused||resume?'↥':'+'}</span><div class="grow"><strong>${store.file||paused||resume?'Разговор — демо.mp4':'Выберите исходный файл'}</strong><p class="muted">${store.file||paused||resume?'24 мин · 286 МБ':'MP4, MOV, WebM, M4A, MP3'}</p></div>${!resume?btn(paused?'Выбрать исходный файл':store.file?'Заменить файл':'Выбрать файл','pick',!store.file?'primary':''):''}</div><div class="upload-meta"><span>2–${limit()} минут · до 2 ГБ</span>${store.role!=='owner'?'<span>Доступно 120 кредитов</span>':'<span>Возможности Pro</span>'}</div><div class="start-block">${resume?btn('Приостановить загрузку','pause'):btn(paused?'Продолжить загрузку':'Создать клипы →',paused?'resume':'create','primary',!store.file?'disabled':'')}${cost()}</div>${paused||resume?'<p class="small muted">Продолжение использует прежние параметры. Новая загрузка расходует отдельный слот и может оставить прежнюю запись незавершённой.</p>'+btn('Начать новую загрузку','new-upload','text'):advanced()}</section>${referral()}</div><section class="section" id="recent-records"><h2>Последние записи</h2><button class="record" type="button" data-action="result"><span><strong>Разговор с гостем</strong><small>24 мин · 3 готовых клипа</small></span><span class="status-word">Готово →</span></button><button class="record" type="button" data-action="partial"><span><strong>Новый взгляд на привычные вещи</strong><small>38 мин · 2 из 3 готовы</small></span><span class="status-word">Частично →</span></button></section>`;}
function progress(){if(store.state==='paused'||store.state==='resuming')return workspace();const failed=store.state==='failed',network=store.state==='network';return `<section class="processing">${btn('← Все записи','home','text')}${heading(failed?'Обработка не завершена':network?'Обновляем статус':'Создаём клипы','Разговор — демо.mp4 · 24 минуты')}${failed?`<div class="notice error" role="alert"><h2>Не удалось завершить монтаж</h2><p>Временная ошибка обработки. Готовых клипов пока нет. За запись повторно не списываем.</p></div>${btn('Повторить обработку','retry','primary')}<p class="quiet" style="margin-top:1rem">Демонстрация состояния, в котором сервер разрешает повтор.</p>${btn('Помощь с этой записью','support','text')}`:`${network?'<div class="notice" role="status"><p>Статус давно не менялся. Обработка может продолжаться. Проверяем автоматически — новый запуск не нужен.</p></div>':''}<div class="process-title"><h2>Выбираем лучшие моменты</h2><span>${network?'Последний известный этап':'3 из 4 этапов'}</span></div><div class="process-track" role="progressbar" aria-label="Прогресс обработки" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span style="width:62%"></span></div><ol class="stages"><li>✓ Загрузка</li><li>✓ Расшифровка</li><li aria-current="step">◷ Выбор моментов</li><li>○ Монтаж</li></ol><p class="quiet">Можно вернуться к записям. Эта страница показывает текущий этап.</p><details><summary>Подробнее об обработке</summary><div><p class="small muted">Предварительный резерв: 24 кредита. Списание за исходную запись — один раз при первом готовом клипе. При техническом отказе без готовых клипов резерв вернётся.</p><p class="small muted">Идентификатор: demo-record · данные примера</p></div></details>`}</section>`;}
function result(){const partial=store.state==='partial',index=store.selected,unavailable=partial&&index===2;return `${btn('← Все записи','home','text')}<div class="result-top">${heading(partial?'Готово 2 из 3 клипов':'Клипы готовы','Разговор — демо.mp4 · 24 минуты')}</div>${partial?`<div class="notice" role="status"><h2>Готовые клипы доступны</h2><p class="small">Один клип не собран. Готовые можно смотреть и скачивать.</p>${btn('Повторить монтаж 1 клипа','retry-partial')}<p class="small muted" style="margin-top:.6rem">Без нового списания за исходную запись.</p></div>`:''}${store.state==='network'?'<div class="notice" role="status">Не удалось обновить статус. Доступные клипы остаются на месте; проверяем автоматически.</div>':''}<div class="result-grid"><article class="selected-clip ${partial?'partial':''}"><div class="fake-player" aria-label="Демонстрационный плеер">${unavailable?'<p>Клип не собран</p>':`${btn(store.played?'Ⅱ':'▷','play','play','aria-label="'+(store.played?'Пауза демо-плеера':'Воспроизвести демо-клип')+'"')}<small>Превью макета · без медиа</small><span class="fake-controls">${store.played?'0:08':'0:00'} / 0:46 ─────── ⛶</span>`}</div><div class="clip-info"><p class="eyebrow">Фрагмент ${String(index+1).padStart(2,'0')} · 46 секунд</p><h2>${titles[index]}</h2><p class="small muted retention">Хранится до 8 декабря 2026, 12:00 МСК</p>${btn(unavailable?'Клип пока недоступен':'↓ Скачать клип','download','primary download-main',unavailable?'disabled':'')}${store.savedCtaKind!=='none'?`<p class="small muted saved-cta-summary">Призыв сохранён · ${escape(store.savedCtaUrl)}</p>`:''}<details class="clip-more"><summary>Ещё</summary><div><div class="actions">${btn('Поделиться','share','',unavailable?'disabled':'')}${btn('Изменить оформление','edit-clip','',unavailable?'disabled':'')}</div><details><summary>Оценка фрагмента</summary><div><p class="small">Оценка 87 из 99 · цепкость 30 · самодостаточность 29 · длина 28.</p><p class="small muted">Момент содержит самостоятельную мысль и понятное начало. Объяснение — демонстрационное.</p></div></details></div></details></div></article><nav class="clip-list" aria-label="Фрагменты"><h2>Фрагменты</h2>${titles.map((t,i)=>`<button class="clip-item" type="button" data-clip="${i}" aria-current="${index===i}"><span data-num>${String(i+1).padStart(2,'0')}</span><span><strong>${t}</strong><small>${partial&&i===2?'Не удалось собрать':'46 секунд · готово'}</small></span></button>`).join('')}</nav></div><section id="context-panel" class="share-panel" ${!store.share?'hidden':''}>${contextPanel()}</section>`;}
function eligibleGuestClips(){return titles.map((_,index)=>index).filter(index=>!(store.state==='partial'&&index===2));}
function resetGuestConsent(){store.guestConsent=false;const box=$('#guest-consent');if(box)box.checked=false;const submit=$('#guest-submit');if(submit)submit.disabled=true;}
function guestPackList(){return store.guestPacks.length?`<section class="section" aria-label="Созданные гостевые пакеты"><h3>Созданные пакеты</h3>${store.guestPacks.map(pack=>`<article class="person" data-guest-pack="${pack.id}"><h3>${escape(pack.name)}</h3><p class="small muted">${pack.clips.length} клипа · ${pack.status==='revoked'?'Доступ отозван':pack.status==='sent'?'Ссылка включена на 14 дней':'Закрытый пакет, ссылка не включена'}</p>${pack.status==='sent'?`<p class="small muted">https://clipmkr.ru/g/demo-guest-${pack.id} · пример, не рабочая ссылка</p>`:''}${pack.status!=='revoked'?`<p class="small muted">Отзыв закроет гостевую страницу и доступ к файлам через неё. Срок хранения клипов может закончиться раньше ссылки.</p><div class="row">${pack.status==='sent'?btn('Копировать ссылку','copy-guest','','data-pack-id="'+pack.id+'"'):btn('Включить ссылку на 14 дней','guest-send','','data-pack-id="'+pack.id+'"')}${btn('Отозвать доступ','guest-revoke','','data-pack-id="'+pack.id+'"')}</div>`:''}</article>`).join('')}</section>`:'';}
function contextPanel(){
 if(['share','guest-created','guest-sent'].includes(store.share))return `<h2>Поделиться клипом</h2><p class="small muted">Ссылка на клип открывает превью и призыв автора. Гостевой пакет даёт доступ к просмотру и скачиванию.</p><div class="row">${btn('Копировать ссылку на превью','copy-clip')}${btn('Отправить гостю','guest')}${btn('Закрыть','close-context','text')}</div>${guestPackList()}`;
 if(store.share==='guest')return `<form id="guest-form" class="guest-form fields"><h2>Клипы для гостя</h2><label>Имя гостя<input name="guest-name" required maxlength="100" value="${escape(store.guestName)}" placeholder="Как обратиться к гостю"></label><fieldset style="border:0;padding:0;margin:0"><legend class="small">Готовые клипы пакета</legend>${eligibleGuestClips().map(index=>`<label class="check"><input type="checkbox" data-guest-clip="${index}" ${store.guestSelected.includes(index)?'checked':''}>${titles[index]}</label>`).join('')}</fieldset><label class="check"><input id="guest-consent" type="checkbox" required ${store.guestConsent?'checked':''}>Подтверждаю, что получил(а) разрешение гостя на публикацию выбранных клипов и передачу ссылки.</label><p class="small muted">Согласие относится к указанному гостю и выбранным клипам. Изменение имени или состава требует нового подтверждения.</p><p class="small muted">Сначала создадим закрытый пакет. По отдельной команде включим гостевую ссылку на 14 дней; файлы ограничены своим сроком хранения.</p><div class="row"><button type="submit" class="primary" id="guest-submit" ${!store.guestConsent||!store.guestSelected.length?'disabled':''}>Создать закрытый пакет</button>${btn('Отмена','close-context','text')}</div></form>`;
 if(store.share==='edit')return `<h2>Оформление клипа</h2><form id="clip-edit" class="fields"><label>Музыка<select id="clip-music-choice">${[["none","Без музыки"],["auto","Авто"],["komiku","Komiku · Everything Is Groovy"]].map(([value,label])=>`<option value="${value}" ${(store.clipMusicDraft[store.selected]??store.clipMusicSaved[store.selected]??"none")===value?"selected":""}>${label}</option>`).join('')}</select></label><details><summary>Предпрослушать музыку</summary><div>${['Komiku · Everything Is Groovy','HoliznaCC0 · One Good Day'].map(track=>btn(store.previewTrack===track?'■ Остановить '+track:'▷ Послушать '+track,'preview-track','','data-track="'+escape(track)+'"')).join('')}<p class="small muted">Демо управления предпрослушиванием. Реальное аудио не подключено; пересборка не запускается.</p></div></details><p class="small muted">Смена музыки пересоберёт этот клип и использует одну пересборку из суточного лимита. Предыдущий файл останется доступен до готовности нового.</p><div class="row"><button class="primary" type="submit">Применить музыку</button>${btn('Отмена','close-context','text')}</div></form><details><summary>Дополнительные настройки записи</summary><form id="video-cta-edit" class="fields"><p class="small muted">Призыв применяется ко всем готовым клипам записи. Смена его вида использует по одной пересборке на клип; смена только ссылки — без пересборки.</p><label>Призыв в конце<select id="edit-cta-kind">${[["none","Без призыва"],["full","Смотреть полный выпуск"],["subscribe","Подписаться"],["link","Перейти по ссылке"]].map(([value,label])=>`<option value="${value}" ${store.editCtaKind===value?"selected":""}>${label}</option>`).join('')}</select></label><label id="edit-cta-url-field" ${store.editCtaKind==='none'?'hidden':''}>Ссылка (https://…)<input id="edit-cta-url" type="url" value="${escape(store.editCtaUrl)}" ${store.editCtaKind!=='none'?'required':''} placeholder="https://example.com/episode"><small>Кнопка с этой ссылкой появится на странице клипа; домен увидит зритель.</small></label><button type="submit">Сохранить призыв</button></form></details>`;return '';}
function stats(){if(store.role!=='blogger')return heading('Статистика блогера','Этот раздел предназначен для назначенного блогера. В макете выберите роль «Блогер».');return `${btn('← Новая запись','home','text')}${heading('Результат вашей ссылки','За всё время · данные примера. Показатели только ваших ссылок.')}${referral()}<dl class="stats"><div><dt>Переходы</dt><dd>248</dd></div><div><dt>Регистрации</dt><dd>42</dd></div><div><dt>Загруженные записи</dt><dd>18</dd></div><div><dt>Покупки пакетов</dt><dd>7</dd></div></dl><p class="quiet">Подтверждённая выручка пакетов: 12 930 ₽. Возвращённые платежи не включены. Это статистика привлечения, не расчёт выплаты.</p><details><summary>Дополнительные показатели и ссылки</summary><div><p class="small muted">Клипы, вышедшие наружу: 12 · приглашённые гости: 4.</p><label>Статистика по ссылке<select><option>Все мои ссылки · за всё время</option><option>author-demo</option><option>Прежняя ссылка</option></select></label><form id="extra-code-form" class="fields" style="margin-top:1rem"><label>Дополнительный код партнёра<input name="extra-code" pattern="(?:[A-Za-z0-9_]|-){6,12}" minlength="6" maxlength="12" required placeholder="6–12 латинских букв, цифр, _ или -"></label><button type="submit">Создать дополнительную ссылку</button><p class="small muted">Не заменяет основную автоссылку. Только демонстрация; новая ссылка в интернете не создаётся.</p></form>${store.extraCodes.map(code=>`<p class="small">https://clipmkr.ru/r/${escape(code)} · пример ${btn('Копировать','copy-ref')}</p>`).join('')}<p class="small muted" style="margin-top:1rem">Прежние ссылки и атрибуции сохраняются. Нет месячного расчёта вознаграждения в этом кабинете.</p></div></details>`;}

});
document.addEventListener('change',e=>{const id=e.target.id;if(id.startsWith('demo-')){const key=id.slice(5);if(['theme','layout'].includes(key)){document.documentElement.dataset[key]=e.target.value;const select=$('#account-'+key);if(select)select.value=e.target.value;}else{if(key==='state'||key==='role')resetGuestConsent();store[key]=e.target.value;if(key==='state'&&['done','partial'].includes(store.state)){store.screen='result';$('#demo-screen').value='result';}if(key==='state'&&store.state==='failed'){store.screen='progress';$('#demo-screen').value='progress';}if(key==='state'&&['link-loading','link-error','link-blocked'].includes(store.state)){store.screen='workspace';$('#demo-screen').value='workspace';}if(key==='state'&&['paused','resuming'].includes(store.state)){store.screen='workspace';$('#demo-screen').value='workspace';}render();}}else if(id.startsWith('opt-')){const key={music:'music',teaser:'teaser',compact:'compact',cta:'cta','cta-url':'ctaUrl'}[id.slice(4)];if(key)store[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(id==='opt-cta')$('#cta-url-field').hidden=store.cta==='none';updateOptions();}else if(id==='clip-music-choice')store.clipMusicDraft[store.selected]=e.target.value;else if(e.target.matches('[data-guest-clip]')){const index=Number(e.target.dataset.guestClip);store.guestSelected=e.target.checked?[...new Set([...store.guestSelected,index])]:store.guestSelected.filter(value=>value!==index);resetGuestConsent();}else if(id==='edit-cta-kind'){store.editCtaKind=e.target.value;const active=e.target.value!=='none';$('#edit-cta-url-field').hidden=!active;$('#edit-cta-url').required=active;}else if(id==='guest-consent'){store.guestConsent=e.target.checked;$('#guest-submit').disabled=!store.guestConsent||!store.guestSelected.length;}else if(id==='delete-consent')$('#delete-button').disabled=!e.target.checked;else if(id==='owner-commission'){store.commission=e.target.value;updatePolicy();}else if(id==='owner-limit'){store.limit=e.target.value;updatePolicy();}else if(id==='account-theme'||id==='account-layout'){const key=id.slice(8);document.documentElement.dataset[key]=e.target.value;$('#demo-'+key).value=e.target.value;}});
document.addEventListener('input',e=>{if(e.target.id==='owner-reason')store.reason=e.target.value;if(e.target.id==='opt-cta-url')store.ctaUrl=e.target.value;if(e.target.id==='edit-cta-url')store.editCtaUrl=e.target.value;if(e.target.name==='guest-name'){store.guestName=e.target.value;resetGuestConsent();}});
document.addEventListener('invalid',e=>{const field=e.target;for(let parent=field.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;field.focus();showToast(field.validationMessage||'Проверьте выделенное поле.');},true);
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='auth-form'){showToast('Демо: вход не отправляется. Открыт кабинет с данными примера.');go('workspace','normal');}else if(e.target.id==='owner-search'){store.found=true;store.editing=false;render();}else if(e.target.id==='owner-assign'){store.saved=true;store.targetBlogger=true;store.editing=false;render();showToast('Демо: назначение показано, роль на сервере не менялась.');}else if(e.target.id==='guest-form'){const eligible=eligibleGuestClips();if(!store.guestConsent||!store.guestName.trim()||!store.guestSelected.length||store.guestSelected.some(index=>!eligible.includes(index)))return;const pack={id:store.nextGuestId++,name:store.guestName.trim(),clips:[...store.guestSelected],status:'created'};store.guestPacks.push(pack);store.activeGuestId=pack.id;store.guestName='';store.guestSelected=[];resetGuestConsent();store.share='guest-created';revealContext();}else if(e.target.id==='clip-edit'){store.clipMusicSaved[store.selected]=store.clipMusicDraft[store.selected]??store.clipMusicSaved[store.selected]??'none';showToast('Демо: пересборка показана. Предыдущий файл остаётся доступен; запрос не отправлен.');store.share='';render();}else if(e.target.id==='video-cta-edit'){const input=$('#edit-cta-url');if($('#edit-cta-kind').value!=='none'&&!/^https:\/\//.test(input.value)){input.focus();showToast('Укажите адрес https://.');return;}store.savedCtaKind=store.editCtaKind;store.savedCtaUrl=store.editCtaKind==='none'?'':store.editCtaUrl;showToast('Демо: призыв сохранён. Сетевого запроса и пересборки нет.');}else if(e.target.id==='extra-code-form'){const code=new FormData(e.target).get('extra-code').trim();if(!store.extraCodes.includes(code))store.extraCodes.push(code);showToast('Демо: дополнительная ссылка показана, в интернете не создаётся.');render();const details=$('#main details');if(details)details.open=true;}else if(e.target.id==='report-month')showToast('Демо: отчёт за выбранный месяц, сетевого запроса нет.');else if(e.target.id==='recovery-form')showToast('Макет: письмо не отправляется. Реальный пароль и подтверждение почты не меняются.');});
render();
</script></body></html>
